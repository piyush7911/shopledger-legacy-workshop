<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express routes, library modules, configuration, JSON data store, and the flow of placing an order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .section { font-size: 16px; font-weight: 700; fill: #334155; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-text { font-size: 12px; fill: #475569; }
      .small { font-size: 11px; fill: #475569; }
      .box { stroke-width: 1.5; rx: 10; }
      .ui { fill: #eff6ff; stroke: #60a5fa; }
      .route { fill: #f5f3ff; stroke: #8b5cf6; }
      .lib { fill: #ecfdf5; stroke: #34d399; }
      .infra { fill: #fff7ed; stroke: #fb923c; }
      .data { fill: #fef2f2; stroke: #f87171; }
      .flow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#flowArrow); }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
      .label { font-size: 11px; fill: #1d4ed8; font-weight: 600; }
      .legend-text { font-size: 12px; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>
  <text x="60" y="52" class="title">ShopLedger architecture</text>
  <text x="60" y="78" class="subtitle">Express POS, inventory, GST pricing, Khata credit ledger, and JSON persistence</text>

  <!-- Main architecture -->
  <rect x="45" y="110" width="1510" height="510" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="142" class="section">Application architecture</text>

  <rect x="75" y="175" width="255" height="175" class="box ui"/>
  <text x="95" y="205" class="box-title">UI</text>
  <text x="95" y="230" class="box-text">public/index.html</text>
  <text x="95" y="250" class="box-text">public/js/app.js</text>
  <text x="95" y="270" class="box-text">public/css/style.css</text>
  <text x="95" y="304" class="small">POS catalog and cart</text>
  <text x="95" y="322" class="small">Order history and invoice links</text>
  <text x="95" y="340" class="small">Khata settlements and audit view</text>

  <rect x="385" y="175" width="220" height="175" class="box infra"/>
  <text x="405" y="205" class="box-title">server.js</text>
  <text x="405" y="230" class="box-text">Express app</text>
  <text x="405" y="250" class="box-text">body-parser JSON</text>
  <text x="405" y="270" class="box-text">static public/ files</text>
  <text x="405" y="304" class="small">Mounts all /api routers</text>
  <text x="405" y="322" class="small">GET /orders/:id/invoice</text>

  <rect x="660" y="155" width="205" height="92" class="box route"/>
  <text x="680" y="184" class="box-title">routes/products.js</text>
  <text x="680" y="208" class="box-text">/api/products</text>
  <text x="680" y="226" class="box-text">/api/coupons</text>

  <rect x="660" y="270" width="205" height="110" class="box route"/>
  <text x="680" y="299" class="box-title">routes/orders.js</text>
  <text x="680" y="323" class="box-text">/api/orders</text>
  <text x="680" y="341" class="box-text">create, list, get, cancel</text>
  <text x="680" y="359" class="box-text">order placement orchestration</text>

  <rect x="660" y="403" width="205" height="92" class="box route"/>
  <text x="680" y="432" class="box-title">routes/customers.js</text>
  <text x="680" y="456" class="box-text">/api/customers</text>
  <text x="680" y="474" class="box-text">/settle</text>

  <rect x="660" y="518" width="205" height="78" class="box route"/>
  <text x="680" y="547" class="box-title">routes/reports.js</text>
  <text x="680" y="571" class="box-text">dashboard, GST, pricing preview</text>

  <rect x="930" y="145" width="270" height="430" class="box lib"/>
  <text x="955" y="177" class="section">lib/</text>

  <rect x="955" y="195" width="220" height="45" class="box lib"/>
  <text x="970" y="223" class="box-title">orders.js</text>
  <rect x="955" y="250" width="220" height="45" class="box lib"/>
  <text x="970" y="278" class="box-title">inventory.js</text>
  <rect x="955" y="305" width="220" height="45" class="box lib"/>
  <text x="970" y="333" class="box-title">pricing.js</text>
  <rect x="955" y="360" width="220" height="45" class="box lib"/>
  <text x="970" y="388" class="box-title">coupons.js</text>
  <rect x="955" y="415" width="220" height="45" class="box lib"/>
  <text x="970" y="443" class="box-title">tax.js</text>
  <rect x="955" y="470" width="220" height="45" class="box lib"/>
  <text x="970" y="498" class="box-title">ledger.js</text>
  <rect x="955" y="525" width="220" height="45" class="box lib"/>
  <text x="970" y="553" class="box-title">reports.js · invoice.js</text>

  <rect x="1260" y="175" width="245" height="100" class="box infra"/>
  <text x="1280" y="205" class="box-title">config.js</text>
  <text x="1280" y="229" class="box-text">shop, tax, inventory</text>
  <text x="1280" y="247" class="box-text">coupons, port, admin key</text>

  <rect x="1260" y="310" width="245" height="125" class="box infra"/>
  <text x="1280" y="340" class="box-title">lib/store.js</text>
  <text x="1280" y="364" class="box-text">read() / write()</text>
  <text x="1280" y="384" class="box-text">ensureStructure()</text>
  <text x="1280" y="404" class="box-text">appendAudit()</text>

  <rect x="1260" y="470" width="245" height="105" class="box data"/>
  <text x="1280" y="500" class="box-title">data/db.json</text>
  <text x="1280" y="524" class="box-text">products, orders, customers</text>
  <text x="1280" y="544" class="box-text">settlements, auditLog, IDs</text>

  <!-- Architecture edges -->
  <path d="M330 260 L385 260" class="edge"/>
  <path d="M605 220 L660 210" class="edge"/>
  <path d="M605 260 L660 325" class="edge"/>
  <path d="M605 285 L660 448" class="edge"/>
  <path d="M605 305 L660 555" class="edge"/>
  <path d="M865 210 L930 218" class="edge"/>
  <path d="M865 325 L930 218" class="edge"/>
  <path d="M865 325 L930 273" class="edge"/>
  <path d="M865 325 L930 328" class="edge"/>
  <path d="M865 325 L930 383" class="edge"/>
  <path d="M865 448 L930 493" class="edge"/>
  <path d="M865 555 L930 548" class="edge"/>
  <path d="M1200 220 L1260 225" class="edge dashed"/>
  <path d="M1200 330 L1260 365" class="edge dashed"/>
  <path d="M1200 495 L1260 520" class="edge dashed"/>
  <path d="M1382 435 L1382 470" class="edge"/>
  <path d="M1382 275 L1382 310" class="edge dashed"/>

  <!-- Order flow -->
  <rect x="45" y="650" width="1510" height="410" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="682" class="section">Placing an order</text>
  <text x="70" y="704" class="subtitle">The blue path shows the request flow through routes/orders.js and the modules it coordinates.</text>

  <g>
    <rect x="75" y="755" width="170" height="88" class="box ui"/>
    <text x="95" y="785" class="box-title">1. UI cart</text>
    <text x="95" y="808" class="box-text">Select products,</text>
    <text x="95" y="825" class="box-text">customer, mode, coupon</text>

    <rect x="285" y="755" width="170" height="88" class="box route"/>
    <text x="305" y="785" class="box-title">2. POST /api/orders</text>
    <text x="305" y="808" class="box-text">routes/orders.js</text>
    <text x="305" y="825" class="box-text">validates request</text>

    <rect x="495" y="755" width="170" height="88" class="box lib"/>
    <text x="515" y="785" class="box-title">3. Stock check</text>
    <text x="515" y="808" class="box-text">inventory.js</text>
    <text x="515" y="825" class="box-text">find / check</text>

    <rect x="705" y="755" width="170" height="88" class="box lib"/>
    <text x="725" y="785" class="box-title">4. Totals</text>
    <text x="725" y="808" class="box-text">pricing.js</text>
    <text x="725" y="825" class="box-text">coupons.js + tax.js</text>

    <rect x="915" y="755" width="170" height="88" class="box lib"/>
    <text x="935" y="785" class="box-title">5. Khata check</text>
    <text x="935" y="808" class="box-text">ledger.js</text>
    <text x="935" y="825" class="box-text">only for khata</text>

    <rect x="1125" y="755" width="170" height="88" class="box lib"/>
    <text x="1145" y="785" class="box-title">6. Commit</text>
    <text x="1145" y="808" class="box-text">inventory.js</text>
    <text x="1145" y="825" class="box-text">orders.js</text>

    <rect x="1335" y="755" width="170" height="88" class="box data"/>
    <text x="1355" y="785" class="box-title">7. Persist</text>
    <text x="1355" y="808" class="box-text">store.js</text>
    <text x="1355" y="825" class="box-text">→ data/db.json</text>

    <path d="M245 799 L285 799" class="flow"/>
    <path d="M455 799 L495 799" class="flow"/>
    <path d="M665 799 L705 799" class="flow"/>
    <path d="M875 799 L915 799" class="flow"/>
    <path d="M1085 799 L1125 799" class="flow"/>
    <path d="M1295 799 L1335 799" class="flow"/>
  </g>

  <text x="75" y="895" class="label">On success: HTTP 201 returns the stored order; UI refreshes products, dashboard, and customers.</text>
  <text x="75" y="925" class="label">Invoice: server.js → lib/orders.js → lib/invoice.js → printable HTML at /orders/:id/invoice.</text>
  <text x="75" y="955" class="label">Cancellation: routes/orders.js → lib/orders.js → inventory.js and ledger.js → store.js.</text>

  <!-- Legend -->
  <text x="75" y="1015" class="section">Legend</text>
  <rect x="175" y="998" width="18" height="18" class="box ui"/><text x="203" y="1013" class="legend-text">UI</text>
  <rect x="260" y="998" width="18" height="18" class="box route"/><text x="288" y="1013" class="legend-text">routes/</text>
  <rect x="365" y="998" width="18" height="18" class="box lib"/><text x="393" y="1013" class="legend-text">lib/</text>
  <rect x="445" y="998" width="18" height="18" class="box infra"/><text x="473" y="1013" class="legend-text">server/config/store</text>
  <rect x="650" y="998" width="18" height="18" class="box data"/><text x="678" y="1013" class="legend-text">data/db.json</text>
  <line x1="800" y1="1007" x2="850" y2="1007" class="flow"/><text x="862" y="1013" class="legend-text">order flow</text>
</svg>
